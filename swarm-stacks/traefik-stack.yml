version: '3.8'

services:
  traefik:
    image: traefik:v2.11
    command:
      - --api.dashboard=true
      - --api.insecure=false
      
      - --providers.docker.swarmMode=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik-public
      
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      
      - --certificatesresolvers.letsencrypt.acme.email=benfaez07@gmail.com
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      
      - --log.level=INFO
      - --accesslog=true
    
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    
    networks:
      - traefik-public
    
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == Node-1
      labels:
        - traefik.enable=true
        
        # Router HTTPS (avec SSL - une fois le certificat généré)
        - traefik.http.routers.dashboard.rule=Host(`traefik.faez-studio.fr`)
        - traefik.http.routers.dashboard.service=api@internal
        - traefik.http.routers.dashboard.entrypoints=websecure
        - traefik.http.routers.dashboard.tls.certresolver=letsencrypt
        
        # Router HTTP temporaire (sans SSL - pour accès immédiat)
        - traefik.http.routers.dashboard-http.rule=Host(`traefik.faez-studio.fr`)
        - traefik.http.routers.dashboard-http.service=api@internal
        - traefik.http.routers.dashboard-http.entrypoints=web
        
        - traefik.http.services.dashboard.loadbalancer.server.port=8080
      
      update_config:
        parallelism: 1
        delay: 10s
      
      restart_policy:
        condition: on-failure

networks:
  traefik-public:
    driver: overlay
    attachable: true

volumes:
  traefik-certs:
