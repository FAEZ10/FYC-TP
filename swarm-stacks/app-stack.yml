version: '3.8'

services:
  frontend:
    image: faezbacar/ecommerce-frontend:latest

    
    networks:
      - traefik-public
    
    deploy:
      mode: replicated
      replicas: 2
      
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik_traefik-public
        
        - traefik.http.routers.frontend-http.rule=Host(`app.faez-studio.fr`)
        - traefik.http.routers.frontend-http.entrypoints=web
        - traefik.http.routers.frontend-http.middlewares=frontend-https-redirect
        
        - traefik.http.routers.frontend.rule=Host(`app.faez-studio.fr`)
        - traefik.http.routers.frontend.entrypoints=websecure
        - traefik.http.routers.frontend.tls.certresolver=letsencrypt
        
        - traefik.http.middlewares.frontend-https-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.frontend-https-redirect.redirectscheme.permanent=true
        
        - traefik.http.services.frontend.loadbalancer.server.port=80
        
        - traefik.http.middlewares.security-headers.headers.framedeny=true
        - traefik.http.middlewares.security-headers.headers.sslredirect=true
        - traefik.http.routers.frontend.middlewares=security-headers
      
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 5s
      
      rollback_config:
        parallelism: 1
        delay: 5s
      
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  api:
    image: faezbacar/ecommerce-backend:latest

    secrets:
      - db_password
    
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_NAME=ecommerce
      - DB_PASSWORD_FILE=/run/secrets/db_password
    
    networks:
      - traefik-public
      - frontend-net
      - backend-net
    
    stop_grace_period: 10s
    
    deploy:
      mode: replicated
      replicas: 3
      
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik_traefik-public
        
        - traefik.http.routers.api-http.rule=Host(`api.faez-studio.fr`)
        - traefik.http.routers.api-http.entrypoints=web
        - traefik.http.routers.api-http.middlewares=api-https-redirect
        
        - traefik.http.routers.api.rule=Host(`api.faez-studio.fr`)
        - traefik.http.routers.api.entrypoints=websecure
        - traefik.http.routers.api.tls.certresolver=letsencrypt
        
        - traefik.http.middlewares.api-https-redirect.redirectscheme.scheme=https
        - traefik.http.middlewares.api-https-redirect.redirectscheme.permanent=true
        
        - traefik.http.services.api.loadbalancer.server.port=8080
        
        - traefik.http.middlewares.api-ratelimit.ratelimit.average=100
        - traefik.http.middlewares.api-ratelimit.ratelimit.burst=50
        - traefik.http.routers.api.middlewares=api-ratelimit
      
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 5s
      
      rollback_config:
        parallelism: 1
        delay: 5s
      
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  database:
    image: postgres:15-alpine
    
    secrets:
      - db_password
    
    configs:
      - source: db_init_script
        target: /docker-entrypoint-initdb.d/init.sql
        mode: 0444
    
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_USER=postgres
      - POSTGRES_DB=ecommerce
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
    
    volumes:
      - db-data:/var/lib/postgresql/data
    
    networks:
      - backend-net
    
    deploy:
      mode: replicated
      replicas: 1
      
      placement:
        constraints:
          - node.hostname == Node-1

      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  traefik-public:
    external: true
    name: traefik_traefik-public
    
  frontend-net:
    driver: overlay
    attachable: true
  
  backend-net:
    driver: overlay
    internal: true
    attachable: true

secrets:
  db_password:
    external: true

configs:
  db_init_script:
    file: ../backend/init.sql

volumes:
  db-data:
    driver: local
